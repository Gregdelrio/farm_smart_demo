<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Locks pinch-zoom off so our large touch targets stay reliably large
     on screen — important when the user is wearing gloves. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1c1c1a">
<title>FarmSmart</title>

<!-- Icon font. This is a CDN link: the icon files themselves are NOT
     part of this project, they're fetched from Cloudflare's public CDN
     the first time the page loads. Every <i class="ti ti-xxx"></i> tag
     anywhere in this app (including inside each tile's own template
     string) renders using this file. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">

<!-- Shared design system (header, card shell, sheets, dialogs, toast).
     No tile-specific rules live here — see css/tiles/ below. -->
<link rel="stylesheet" href="css/base.css">

<!-- ================================================================
     TILE STYLESHEETS
     One <link> per tile. Comment out (or delete) a line to remove
     that tile's visual styling — pair it with removing the matching
     <script> tag near the bottom of this file.
================================================================= -->
<link rel="stylesheet" href="css/tiles/vat.css">
<link rel="stylesheet" href="css/tiles/crossing.css">
<link rel="stylesheet" href="css/tiles/milking.css">
<link rel="stylesheet" href="css/tiles/milk-statement.css">
<link rel="stylesheet" href="css/tiles/gates.css">
</head>
<body>

  <!-- Everything lives inside #appFrame — see the "0. APP FRAME" comment
       at the top of css/base.css for why this wrapper exists (it's what
       keeps the app phone-sized and centered on a desktop browser). -->
  <div id="appFrame">

  <!-- ============================================================
       HEADER
       Row 1: brand mark
       Row 2: farm picker (left) + theme toggle + user picker (right,
              grouped together) — same row
       Row 3: sync status pill
  ============================================================ -->
  <div class="app-header">
    <div class="brand">FarmSmart</div>

    <div class="header-row">
      <button class="farm-picker" onclick="openFarmSheet()">
        <span class="eyebrow">Active farm</span>
        <span class="name-row">
          <span class="name" id="activeFarmName">Laang Farm</span>
          <i class="ti ti-chevron-down"></i>
        </span>
      </button>

      <div class="user-picker-group">
        <!-- Dark/light mode toggle — sun/moon drawn as inline SVG
             (not the icon font) so it always renders even if the
             CDN icon font is slow/blocked. Persisted per-device via
             localStorage, see js/core.js §6. -->
        <button class="theme-toggle" id="themeToggleBtn" aria-label="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
        </button>

        <button class="user-picker" onclick="openUserSheet()">
          <span class="user-picker__avatar" id="activeUserInitials">J</span>
          <span class="user-picker__text">
            <span class="user-picker__name" id="activeUserName">John</span>
            <span class="user-picker__role" id="activeUserRole">Owner</span>
          </span>
          <i class="ti ti-chevron-down"></i>
        </button>
      </div>
    </div>

    <div class="sync-row">
      <div class="sync-pill" id="syncPill"><span class="dot"></span><span>Synced</span></div>
    </div>
  </div>

  <p class="section-label">Dashboard</p>

  <!-- ============================================================
       DASHBOARD — intentionally EMPTY. Each tile injects its own
       markup here at runtime (see js/core.js §7 mountTiles). The
       order tiles appear on screen matches the order their <script>
       tags are listed at the bottom of this file.
  ============================================================ -->
  <main id="dashboard"></main>

  <!-- ============================================================
       FARM SWITCHER SHEET
  ============================================================ -->
  <div class="sheet-mask" id="farmSheetMask">
    <div class="sheet">
      <h2>Switch farm</h2>
      <div id="farmList"></div>
    </div>
  </div>

  <!-- ============================================================
       USER SWITCHER SHEET
       Both users currently see/do the same things — role-based
       restriction isn't implemented yet (see js/core.js §3 TODO).
  ============================================================ -->
  <div class="sheet-mask" id="userSheetMask">
    <div class="sheet">
      <h2>Switch user</h2>
      <div id="userList"></div>
    </div>
  </div>

  <!-- ============================================================
       GENERIC CONFIRMATION DIALOG (neutral, not red — see base.css)
  ============================================================ -->
  <div class="confirm-mask" id="confirmMask">
    <div class="confirm-box">
      <h2 id="confirmTitle">Confirm?</h2>
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button class="cancel" onclick="closeConfirm()">Cancel</button>
        <button class="ok" id="confirmOkBtn">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  </div><!-- /#appFrame -->

  <!-- ============================================================
       SCRIPTS
       Load order matters: core.js first (defines FarmSmart +
       registerTile), then one <script> per tile. Each tile calls
       registerTile() as soon as it loads; core.js then mounts all
       of them, in this order, once the page is ready.

       TO DISABLE A TILE: comment out (or delete) its <script> line
       here AND its matching <link> line in <head> above. That's the
       only file you need to touch.
  ============================================================ -->
  <script src="js/core.js"></script>
  <script src="js/tiles/vat.js"></script>
  <script src="js/tiles/crossing.js"></script>
  <script src="js/tiles/milking.js"></script>
  <script src="js/tiles/milk-statement.js"></script>
  <script src="js/tiles/gates.js"></script>
</body>
</html>
