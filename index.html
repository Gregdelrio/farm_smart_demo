<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No pinch-zoom: keeps the large touch targets usable with gloves on. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1c1c1a">
<title>FarmSmart</title>

<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">

<!-- iOS ignores manifest.json for the home-screen icon. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="manifest" href="manifest.json">

<!-- Icon font for every <i class="ti ti-xxx">. Pinned so a new release
     can't rename or drop an icon under us. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css">

<link rel="stylesheet" href="css/base.css">

<!-- One stylesheet per tile: disable a tile here AND at the bottom. -->
<link rel="stylesheet" href="css/tiles/vat.css">
<link rel="stylesheet" href="css/tiles/crossing.css">
<link rel="stylesheet" href="css/tiles/milking.css">
<!-- <link rel="stylesheet" href="css/tiles/milk-statement.css"> -->
<link rel="stylesheet" href="css/tiles/gates.css">
<link rel="stylesheet" href="css/tiles/roster.css">
<link rel="stylesheet" href="css/tiles/timesheet.css">
<link rel="stylesheet" href="css/tiles/shift-clock.css">
<link rel="stylesheet" href="css/tiles/farm-plan.css">
</head>
<body>

  <!-- Keeps the app phone-sized and centred on desktop (see css/base.css). -->
  <div id="appFrame">

  <!-- Invites visitors to tap around; dismissal is remembered. -->
  <div class="demo-banner" id="demoBanner">
    <span class="demo-banner__text"><i class="ti ti-flask"></i>This is a demo — feel free to tap buttons and edit values, nothing will break.</span>
    <button class="demo-banner__close" id="demoBannerClose" aria-label="Dismiss">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <!-- Header: brand / farm picker + theme + user / sync status -->
  <div class="app-header">
    <div class="brand-row">
      <img class="brand-logo" src="icons/header-logo.png" alt="">
      <div class="brand">FarmSmart</div>
    </div>

    <div class="header-row">
      <button class="farm-picker" onclick="openFarmSheet()">
        <span class="eyebrow">Active farm</span>
        <span class="name-row">
          <span class="name" id="activeFarmName">Maguires Road Dairy</span>
          <i class="ti ti-chevron-down"></i>
        </span>
      </button>

      <div class="user-picker-group">
        <!-- Inline SVG rather than the icon font, so it shows even if
             the CDN is slow or blocked. -->
        <button class="theme-toggle" id="themeToggleBtn" aria-label="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
        </button>

        <button class="user-picker" onclick="openUserSheet()">
          <span class="user-picker__avatar" id="activeUserInitials">J</span>
          <span class="user-picker__text">
            <span class="user-picker__name" id="activeUserName">John</span>
            <span class="user-picker__role" id="activeUserRole">Owner</span>
          </span>
          <i class="ti ti-chevron-down"></i>
        </button>
      </div>
    </div>

    <div class="sync-row">
      <div class="sync-pill" id="syncPill"><span class="dot"></span><span>Synced</span></div>
    </div>
  </div>

  <p class="section-label">Dashboard</p>

  <!-- Filled at runtime by each tile, in <script> order (js/core.js). -->
  <main id="dashboard"></main>

  <div class="share-row">
    <button class="card-btn primary" id="shareAppBtn" data-track="Share the app">
      <i class="ti ti-share-3"></i>Share the app
    </button>
  </div>

  <div class="sheet-mask" id="farmSheetMask">
    <div class="sheet">
      <h2>Switch farm</h2>
      <div id="farmList"></div>
    </div>
  </div>

  <div class="sheet-mask" id="userSheetMask">
    <div class="sheet">
      <h2>Switch user</h2>
      <div id="userList"></div>
    </div>
  </div>

  <div class="confirm-mask" id="confirmMask">
    <div class="confirm-box">
      <h2 id="confirmTitle">Confirm?</h2>
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button class="cancel" onclick="closeConfirm()">Cancel</button>
        <button class="ok" id="confirmOkBtn">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  </div><!-- /#appFrame -->

  <!-- supabase-js and core.js first, then one script per tile, in display order.
       To disable a tile, comment out its <script> here AND its <link>
       in <head>. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/tiles/vat.js"></script>
  <script src="js/tiles/crossing.js"></script>
  <script src="js/tiles/milking.js"></script>
  <!-- <script src="js/tiles/milk-statement.js"></script> -->
  <script src="js/tiles/gates.js"></script>
  <script src="js/tiles/timesheet.js"></script>
  <script src="js/tiles/shift-clock.js"></script>
  <script src="js/tiles/roster.js"></script>
  <script src="js/tiles/farm-plan.js"></script>
</body>
</html>
